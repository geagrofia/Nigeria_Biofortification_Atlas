name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages site
        run: |
          mkdir _site

          # Copy all HTML files from the repository root
          for file in *.html; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done

          # Start the index page
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">

            <title>Reports</title>

            <style>
              body {
                font-family: Arial, sans-serif;
                max-width: 900px;
                margin: 40px auto;
                padding: 0 20px;
                line-height: 1.5;
              }

              h1 {
                margin-bottom: 30px;
              }

              ul {
                padding-left: 25px;
              }

              li {
                margin: 10px 0;
              }

              a {
                text-decoration: none;
              }

              a:hover {
                text-decoration: underline;
              }
            </style>
          </head>

          <body>

          <h1>Reports</h1>

          <ul>
          EOF

          # Add one entry for each HTML file
          for file in *.html; do

            if [ -f "$file" ] && [ "$file" != "index.html" ]; then

              # Extract the page title from the HTML <title> element
              title=$(grep -oi '<title[^>]*>[^<]*</title>' "$file" \
                | head -1 \
                | sed -E 's/<\/?title[^>]*>//Ig')

              # If no title was found, use the filename
              if [ -z "$title" ]; then
                title="${file%.html}"
                title="${title//_/ }"
              fi

              # Add the link to the index
              printf '    <li><a href="%s">%s</a></li>\n' \
                "$file" "$title" >> _site/index.html

            fi

          done

          # Finish index.html
          cat >> _site/index.html <<'EOF'
          </ul>

          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
