name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Pages site
        run: |
          mkdir _site

          # Copy all HTML files to the Pages site
          for file in *.html; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done

          # Start index.html
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">

            <title>Atlas of Biofortification for Nigeria - Outputs</title>

            <style>
              body {
                font-family: Arial, sans-serif;
                max-width: 900px;
                margin: 40px auto;
                padding: 0 20px;
                line-height: 1.5;
              }

              h1 {
                margin-bottom: 30px;
              }

              ul {
                padding-left: 25px;
              }

              li {
                margin: 15px 0;
              }

              a {
                text-decoration: none;
                font-size: 1.05em;
              }

              a:hover {
                text-decoration: underline;
              }

              .date {
                color: #666;
                font-size: 0.9em;
              }
            </style>
          </head>

          <body>

          <h1>Reports</h1>

          <ul>
          EOF

          # Create a temporary file containing:
          # filename | title | last commit date
          temp_file=$(mktemp)

          for file in *.html; do

            if [ -f "$file" ] && [ "$file" != "index.html" ]; then

              # Get the HTML <title>
              title=$(grep -oi '<title[^>]*>[^<]*</title>' "$file" \
                | head -1 \
                | sed -E 's/<\/?title[^>]*>//Ig')

              # Fallback if no <title> is found
              if [ -z "$title" ]; then
                title="${file%.html}"
                title="${title//_/ }"
              fi

              # Get the date of the most recent commit affecting this file
              commit_date=$(git log -1 \
                --format="%cd" \
                --date=format:"%d %B %Y" \
                -- "$file")

              # Fallback if Git cannot find a commit
              if [ -z "$commit_date" ]; then
                commit_date="Unknown"
              fi

              # Store the information for sorting
              printf '%s\t%s\t%s\n' \
                "$title" "$file" "$commit_date" >> "$temp_file"

            fi

          done

          # Sort alphabetically by report title
          sort -f "$temp_file" | while IFS=$'\t' read -r title file commit_date; do

            printf '    <li><a href="%s">%s</a><br><span class="date">Last updated: %s</span></li>\n' \
              "$file" "$title" "$commit_date" >> _site/index.html

          done

          # Finish index.html
          cat >> _site/index.html <<'EOF'
          </ul>

          </body>
          </html>
          EOF

          rm "$temp_file"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4